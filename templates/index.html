{% extends "base.html" %}
{% block title %}Downloads · yt-dlp-web{% endblock %}
{% block content %}
<h1>Downloads</h1>
<form class="download" method="post">
  <input name="url" type="url" required autofocus placeholder="URL" aria-label="URL">
  <button>Download</button>
</form>
<div id="status">{% include "status.html" %}</div>
<script>
const status = document.querySelector("#status")
async function refresh() {
  try { const r = await fetch("/status"); if (r.ok) status.innerHTML = await r.text() }
  finally { setTimeout(refresh, 2000) }
}
setTimeout(refresh, 2000)
</script>
{% endblock %}
